# Fly.io 配置。app 名字全球唯一,首次 `fly launch` 时如果重名可以改成 meemate-你的后缀。
app = "meemate"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # 没人访问时自动停机,再次访问自动醒来。省钱关键。
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# SQLite 文件持久化到 volume
[mounts]
  source = "data"
  destination = "/data"

# 最小规格:1 共享 CPU + 256MB。够跑 Next.js demo。
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
